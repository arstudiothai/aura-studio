<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura Studio — จับไพ่</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-dark: #8a6a1f;
    --gold-light: #e8d08a;
    --beige: #fdf8f0;
    --navy: #0d1525;
    --navy-mid: #1a2744;
    --teal: #7ec8e3;
    --white: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--navy);
    color: var(--white);
    font-family: 'Cormorant Garamond', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Stars background */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    border-radius: 50%;
    background: white;
    animation: twinkle var(--d, 3s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
  }
  @keyframes twinkle {
    0%, 100% { opacity: var(--min-op, 0.2); transform: scale(1); }
    50% { opacity: var(--max-op, 0.8); transform: scale(1.3); }
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 2rem;
    animation: fadeDown 0.8s ease forwards;
  }
  .brand {
    font-family: 'Cinzel', serif;
    font-size: 1.4rem;
    letter-spacing: 0.3em;
    color: var(--gold);
    margin-bottom: 0.3rem;
  }
  .brand-sub {
    font-size: 0.85rem;
    color: var(--teal);
    letter-spacing: 0.2em;
    font-style: italic;
  }
  .divider {
    width: 120px;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold), transparent);
    margin: 1rem auto;
  }

  /* Instruction */
  .instruction {
    text-align: center;
    margin-bottom: 2rem;
    animation: fadeDown 0.8s ease 0.2s both;
  }
  .instruction h2 {
    font-size: 1.5rem;
    font-weight: 300;
    color: var(--beige);
    margin-bottom: 0.5rem;
    line-height: 1.4;
  }
  .instruction p {
    font-size: 0.95rem;
    color: rgba(255,255,255,0.5);
    font-style: italic;
  }

  /* Cards grid */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.6rem;
    width: 100%;
    margin-bottom: 2rem;
  }

  .card-wrapper {
    animation: cardAppear 0.5s ease both;
  }

  @keyframes cardAppear {
    from { opacity: 0; transform: translateY(20px) rotateY(90deg); }
    to { opacity: 1; transform: translateY(0) rotateY(0deg); }
  }

  .tarot-card {
    aspect-ratio: 2/3.2;
    border-radius: 8px;
    border: 1px solid rgba(201,168,76,0.4);
    background: var(--navy-mid);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }

  .tarot-card::before {
    content: '';
    position: absolute;
    inset: 3px;
    border-radius: 5px;
    border: 0.5px solid rgba(201,168,76,0.2);
    pointer-events: none;
  }

  .tarot-card:hover {
    border-color: var(--gold);
    transform: translateY(-4px) scale(1.05);
    box-shadow: 0 8px 24px rgba(201,168,76,0.2), 0 0 0 1px rgba(201,168,76,0.3);
    background: #1e2d52;
  }

  .tarot-card:hover .card-back-pattern {
    opacity: 0.8;
  }

  .tarot-card:active {
    transform: translateY(-2px) scale(1.02);
  }

  .card-back-pattern {
    position: absolute;
    inset: 0;
    opacity: 0.3;
    transition: opacity 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card-symbol {
    font-size: 1.2rem;
    color: var(--gold);
    opacity: 0.6;
  }

  .card-num {
    font-family: 'Cinzel', serif;
    font-size: 0.55rem;
    color: rgba(201,168,76,0.5);
    letter-spacing: 0.1em;
    margin-top: 2px;
  }

  /* Selected state */
  .tarot-card.selected {
    border-color: var(--gold-light);
    background: linear-gradient(135deg, #1e2d52, #2a3d6e);
    box-shadow: 0 0 30px rgba(201,168,76,0.4), 0 0 0 2px var(--gold);
    transform: translateY(-6px) scale(1.08);
    animation: selectedPulse 1s ease infinite;
  }

  @keyframes selectedPulse {
    0%, 100% { box-shadow: 0 0 30px rgba(201,168,76,0.4), 0 0 0 2px var(--gold); }
    50% { box-shadow: 0 0 40px rgba(201,168,76,0.6), 0 0 0 2px var(--gold-light); }
  }

  .tarot-card.selected .card-symbol {
    opacity: 1;
    color: var(--gold-light);
  }

  /* Reveal button */
  .reveal-btn {
    display: none;
    font-family: 'Cinzel', serif;
    font-size: 1rem;
    letter-spacing: 0.2em;
    color: var(--navy);
    background: linear-gradient(135deg, var(--gold), var(--gold-light), var(--gold));
    border: none;
    padding: 1rem 2.5rem;
    border-radius: 50px;
    cursor: pointer;
    margin-top: 1rem;
    transition: all 0.3s ease;
    box-shadow: 0 4px 20px rgba(201,168,76,0.3);
    animation: fadeUp 0.5s ease forwards;
  }

  .reveal-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(201,168,76,0.5);
  }

  .reveal-btn.show { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Result overlay */
  .result-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(8,15,30,0.95);
    z-index: 100;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 2rem;
    text-align: center;
    animation: fadeIn 0.5s ease;
  }

  .result-overlay.show { display: flex; }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .result-card-face {
    width: 140px;
    aspect-ratio: 2/3.2;
    border-radius: 10px;
    border: 1.5px solid var(--gold);
    background: linear-gradient(135deg, var(--navy-mid), #1e2d52);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    margin-bottom: 1.5rem;
    box-shadow: 0 0 40px rgba(201,168,76,0.3);
    animation: cardReveal 0.6s ease forwards;
    position: relative;
    overflow: hidden;
  }

  .result-card-face::before {
    content: '';
    position: absolute;
    inset: 5px;
    border-radius: 6px;
    border: 0.5px solid rgba(201,168,76,0.3);
  }

  @keyframes cardReveal {
    0% { transform: rotateY(90deg) scale(0.8); opacity: 0; }
    60% { transform: rotateY(-10deg) scale(1.05); }
    100% { transform: rotateY(0deg) scale(1); opacity: 1; }
  }

  .result-symbol {
    font-size: 2.5rem;
    margin-bottom: 0.5rem;
    animation: symbolGlow 2s ease infinite;
  }

  @keyframes symbolGlow {
    0%, 100% { text-shadow: 0 0 10px rgba(201,168,76,0.5); }
    50% { text-shadow: 0 0 25px rgba(201,168,76,0.9); }
  }

  .result-card-name {
    font-family: 'Cinzel', serif;
    font-size: 0.75rem;
    color: var(--gold);
    letter-spacing: 0.15em;
    text-align: center;
    padding: 0 0.5rem;
  }

  .result-card-roman {
    font-size: 0.65rem;
    color: var(--teal);
    margin-top: 3px;
    letter-spacing: 0.1em;
  }

  .result-title {
    font-family: 'Cinzel', serif;
    font-size: 1.3rem;
    color: var(--gold);
    margin-bottom: 0.5rem;
    animation: fadeDown 0.5s ease 0.3s both;
  }

  .result-msg {
    font-size: 1rem;
    color: rgba(255,255,255,0.7);
    font-style: italic;
    margin-bottom: 1.5rem;
    line-height: 1.6;
    animation: fadeDown 0.5s ease 0.5s both;
    max-width: 300px;
  }

  .result-btn {
    font-family: 'Cinzel', serif;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    color: var(--navy);
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    border: none;
    padding: 0.8rem 2rem;
    border-radius: 50px;
    cursor: pointer;
    animation: fadeDown 0.5s ease 0.7s both;
    transition: all 0.3s ease;
  }

  .result-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(201,168,76,0.4);
  }

  /* Constellation decoration */
  .constellation {
    position: fixed;
    top: 20px;
    right: 20px;
    opacity: 0.15;
    pointer-events: none;
  }

  .footer-note {
    text-align: center;
    font-size: 0.75rem;
    color: rgba(255,255,255,0.25);
    font-style: italic;
    margin-top: 1.5rem;
    animation: fadeDown 0.8s ease 0.4s both;
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<svg class="constellation" width="120" height="100" viewBox="0 0 120 100">
  <circle cx="20" cy="20" r="2" fill="#c9a84c"/>
  <circle cx="55" cy="10" r="1.5" fill="white"/>
  <circle cx="90" cy="25" r="2.5" fill="#c9a84c"/>
  <circle cx="35" cy="50" r="1.5" fill="white"/>
  <circle cx="70" cy="45" r="2" fill="#7ec8e3"/>
  <circle cx="105" cy="60" r="1.5" fill="white"/>
  <circle cx="15" cy="75" r="2" fill="#c9a84c"/>
  <circle cx="50" cy="85" r="1.5" fill="white"/>
  <circle cx="85" cy="90" r="2" fill="#c9a84c"/>
  <line x1="20" y1="20" x2="55" y2="10" stroke="#c9a84c" stroke-width="0.4" opacity="0.5"/>
  <line x1="55" y1="10" x2="90" y2="25" stroke="#c9a84c" stroke-width="0.4" opacity="0.5"/>
  <line x1="35" y1="50" x2="70" y2="45" stroke="#c9a84c" stroke-width="0.4" opacity="0.5"/>
  <line x1="70" y1="45" x2="105" y2="60" stroke="#c9a84c" stroke-width="0.4" opacity="0.5"/>
  <line x1="15" y1="75" x2="50" y2="85" stroke="#c9a84c" stroke-width="0.4" opacity="0.5"/>
  <line x1="50" y1="85" x2="85" y2="90" stroke="#c9a84c" stroke-width="0.4" opacity="0.5"/>
</svg>

<div class="container">
  <div class="header">
    <div class="brand">AURA STUDIO</div>
    <div class="brand-sub">Your Energy, Your Path.</div>
    <div class="divider"></div>
  </div>

  <div class="instruction">
    <h2>หายใจลึกๆ แล้วเลือกไพ่ที่ดึงดูดใจคุณ</h2>
    <p>ปล่อยใจเป็นอิสระ ไม่ต้องคิดมาก ✨</p>
  </div>

  <div class="cards-grid" id="cardsGrid"></div>

  <button class="reveal-btn" id="revealBtn" onclick="revealCard()">
    ✦ เปิดไพ่ ✦
  </button>

  <div class="footer-note">กดไพ่ใบที่รู้สึกว่าใช่สำหรับวันนี้</div>
</div>

<!-- Result Overlay -->
<div class="result-overlay" id="resultOverlay">
  <div class="result-card-face" id="resultCardFace">
    <div class="result-symbol" id="resultSymbol">✦</div>
    <div class="result-card-name" id="resultCardName"></div>
    <div class="result-card-roman" id="resultCardRoman"></div>
  </div>
  <div class="result-title">ไพ่ของคุณได้รับแล้วค่ะ ✨</div>
  <div class="result-msg">กลับไปที่ Messenger เพื่อรับการสะท้อนพลังงานจาก Aura Studio ค่ะ</div>
  <button class="result-btn" onclick="goToMessenger()">กลับ Messenger →</button>
</div>

<script>
const cards = [
  { num: "0", name: "The Fool", symbol: "🌟", roman: "0" },
  { num: "1", name: "The Magician", symbol: "✨", roman: "I" },
  { num: "2", name: "The High Priestess", symbol: "🌙", roman: "II" },
  { num: "3", name: "The Empress", symbol: "🌸", roman: "III" },
  { num: "4", name: "The Emperor", symbol: "⚔️", roman: "IV" },
  { num: "5", name: "The Hierophant", symbol: "📖", roman: "V" },
  { num: "6", name: "The Lovers", symbol: "💛", roman: "VI" },
  { num: "7", name: "The Chariot", symbol: "🏆", roman: "VII" },
  { num: "8", name: "Strength", symbol: "🦁", roman: "VIII" },
  { num: "9", name: "The Hermit", symbol: "🕯️", roman: "IX" },
  { num: "10", name: "Wheel of Fortune", symbol: "☯️", roman: "X" },
  { num: "11", name: "Justice", symbol: "⚖️", roman: "XI" },
  { num: "12", name: "The Hanged Man", symbol: "🔄", roman: "XII" },
  { num: "13", name: "Death", symbol: "🦋", roman: "XIII" },
  { num: "14", name: "Temperance", symbol: "💧", roman: "XIV" },
  { num: "15", name: "The Devil", symbol: "🔗", roman: "XV" },
  { num: "16", name: "The Tower", symbol: "⚡", roman: "XVI" },
  { num: "17", name: "The Star", symbol: "⭐", roman: "XVII" },
  { num: "18", name: "The Moon", symbol: "🌕", roman: "XVIII" },
  { num: "19", name: "The Sun", symbol: "☀️", roman: "XIX" },
  { num: "20", name: "Judgement", symbol: "🎺", roman: "XX" },
  { num: "21", name: "The World", symbol: "🌍", roman: "XXI" },
];

// Shuffle cards randomly every load
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let selectedCard = null;
const shuffled = shuffle(cards);

// Create stars
const starsEl = document.getElementById('stars');
for (let i = 0; i < 60; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const size = Math.random() * 2.5 + 0.5;
  s.style.cssText = `
    width: ${size}px; height: ${size}px;
    left: ${Math.random() * 100}%;
    top: ${Math.random() * 100}%;
    --d: ${2 + Math.random() * 4}s;
    --delay: ${Math.random() * 4}s;
    --min-op: ${0.1 + Math.random() * 0.2};
    --max-op: ${0.5 + Math.random() * 0.5};
  `;
  starsEl.appendChild(s);
}

// Render cards
const grid = document.getElementById('cardsGrid');
shuffled.forEach((card, idx) => {
  const wrapper = document.createElement('div');
  wrapper.className = 'card-wrapper';
  wrapper.style.animationDelay = `${idx * 0.04}s`;

  const el = document.createElement('div');
  el.className = 'tarot-card';
  el.dataset.num = card.num;
  el.innerHTML = `
    <div class="card-back-pattern">
      <svg width="100%" height="100%" viewBox="0 0 60 96" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="3" width="54" height="90" rx="3" fill="none" stroke="#c9a84c" stroke-width="0.5" opacity="0.4"/>
        <line x1="3" y1="48" x2="57" y2="48" stroke="#c9a84c" stroke-width="0.3" opacity="0.2"/>
        <line x1="30" y1="3" x2="30" y2="93" stroke="#c9a84c" stroke-width="0.3" opacity="0.2"/>
        <circle cx="30" cy="48" r="12" fill="none" stroke="#c9a84c" stroke-width="0.5" opacity="0.3"/>
        <polygon points="30,36 33,44 42,44 35,50 38,58 30,52 22,58 25,50 18,44 27,44" fill="#c9a84c" opacity="0.25"/>
      </svg>
    </div>
    <div class="card-symbol">✦</div>
    <div class="card-num">${String(idx + 1).padStart(2, '0')}</div>
  `;

  el.onclick = () => selectCard(el, card);
  wrapper.appendChild(el);
  grid.appendChild(wrapper);
});

function selectCard(el, card) {
  // Deselect previous
  document.querySelectorAll('.tarot-card.selected').forEach(c => c.classList.remove('selected'));

  el.classList.add('selected');
  selectedCard = card;

  // Short delay for selected animation, then open immediately
  setTimeout(() => revealCard(), 400);
}

function revealCard() {
  if (!selectedCard) return;

  document.getElementById('resultSymbol').textContent = selectedCard.symbol;
  document.getElementById('resultCardName').textContent = selectedCard.name;
  document.getElementById('resultCardRoman').textContent = selectedCard.roman;
  document.getElementById('resultOverlay').classList.add('show');
}

function goToMessenger() {
  // Send card number back via Messenger ref URL
  const cardNum = selectedCard ? selectedCard.num : '0';
  // Replace YOUR_PAGE_ID with actual Facebook Page ID
  const messengerUrl = `https://m.me/1169294569595370?ref=card_${cardNum}`;
  window.location.href = messengerUrl;
}
</script>
</body>
</html>
